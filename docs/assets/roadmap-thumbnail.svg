<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Learning and project roadmap thumbnail</title><desc id="d">A structured roadmap connecting product design, frontend, portfolio, and career milestones.</desc><rect width="1200" height="630" fill="#f7f8fb"/><g transform="translate(64 68)"><text fill="#4f46e5" font-family="Arial" font-size="15" font-weight="900" letter-spacing="5">LEARNING / PROJECTS / CAREER</text><text y="88" fill="#172033" font-family="Arial" font-size="72" font-weight="900">Roadmap</text><text y="138" fill="#657386" font-family="Arial" font-size="22">Turn ambition into sequence, milestones, and review.</text><g transform="translate(0 218)" font-family="Arial"><line x1="40" y1="60" x2="1000" y2="60" stroke="#c7d0df" stroke-width="10" stroke-linecap="round"/><g><circle cx="80" cy="60" r="28" fill="#4f46e5"/><text x="80" y="66" text-anchor="middle" fill="#fff" font-size="18" font-weight="900">1</text><text x="80" y="118" text-anchor="middle" fill="#172033" font-size="17" font-weight="900">Design craft</text></g><g><circle cx="320" cy="60" r="28" fill="#0ea5e9"/><text x="320" y="66" text-anchor="middle" fill="#fff" font-size="18" font-weight="900">2</text><text x="320" y="118" text-anchor="middle" fill="#172033" font-size="17" font-weight="900">Frontend</text></g><g><circle cx="560" cy="60" r="28" fill="#14b8a6"/><text x="560" y="66" text-anchor="middle" fill="#fff" font-size="18" font-weight="900">3</text><text x="560" y="118" text-anchor="middle" fill="#172033" font-size="17" font-weight="900">Projects</text></g><g><circle cx="800" cy="60" r="28" fill="#f59e0b"/><text x="800" y="66" text-anchor="middle" fill="#fff" font-size="18" font-weight="900">4</text><text x="800" y="118" text-anchor="middle" fill="#172033" font-size="17" font-weight="900">Portfolio</text></g><g><circle cx="1040" cy="60" r="28" fill="#ec4899"/><text x="1040" y="66" text-anchor="middle" fill="#fff" font-size="18" font-weight="900">5</text><text x="1040" y="118" text-anchor="middle" fill="#172033" font-size="17" font-weight="900">Career</text></g><rect y="174" width="1060" height="138" rx="22" fill="#fff" stroke="#dce2ec"/><text x="28" y="214" fill="#4f46e5" font-size="13" font-weight="900">REVIEW LOOP</text><text x="28" y="258" fill="#172033" font-size="26" font-weight="900">Plan weekly · ship projects · record evidence · revise monthly</text></g></g><text x="1120" y="604" text-anchor="end" fill="#758195" font-family="Arial" font-size="12" font-weight="800" letter-spacing="3">NISCHHALSUBBA / ROADMAP</text></svg>